<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Mitchll LibreTranslator</title>
  <desc id="desc">Mitchll LibreTranslator 图标——翻译转换箭头</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22272f"/>
      <stop offset="1" stop-color="#15181e"/>
    </linearGradient>
  </defs>
  <!-- 圆角方形背景 -->
  <rect x="4" y="4" width="88" height="88" rx="20" fill="url(#bg)"/>
  <!-- 两个翻译方向的箭头（对应主语种⇄目标语种） -->
  <path d="M 28 34 L 60 34 M 48 26 L 60 34 L 48 42" fill="none" stroke="#5cc8e8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 68 62 L 36 62 M 48 70 L 36 62 L 48 54" fill="none" stroke="#5cc8e8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 中间的圆点(翻译文本) -->
  <circle cx="48" cy="48" r="7" fill="#eef1f6"/>
</svg>